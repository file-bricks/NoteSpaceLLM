[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notespacellm"
version = "1.0.0"
description = "Local NotebookLM alternative for private document analysis, RAG-assisted research, and multi-format report generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.md",
    "THIRD_PARTY_LICENSES.txt"
]
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
keywords = [
    "notebooklm-alternative",
    "rag",
    "local-first",
    "pyside6",
    "document-analysis",
    "document-chat",
    "privacy-first",
    "chromadb",
    "llm",
    "pwa",
    "python",
    "offline-first",
    "research-tools",
    "report-generator",
    "zero-egress"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: General"
]
urls = { Homepage = "https://github.com/file-bricks/NoteSpaceLLM", Repository = "https://github.com/file-bricks/NoteSpaceLLM", Documentation = "https://github.com/file-bricks/NoteSpaceLLM#readme", Issues = "https://github.com/file-bricks/NoteSpaceLLM/issues", Changelog = "https://github.com/file-bricks/NoteSpaceLLM/blob/master/CHANGELOG.md", Notice = "https://github.com/file-bricks/NoteSpaceLLM/blob/master/NOTICE", "Third-Party Licenses" = "https://github.com/file-bricks/NoteSpaceLLM/blob/master/THIRD_PARTY_LICENSES.md" }

dependencies = [
    "PySide6>=6.5.0",
    "PyMuPDF>=1.24.10",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.3",
    "extract-msg>=0.48.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.4",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
]
export = [
    "weasyprint>=60.0",
]
api = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
dev = [
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = "."
python_files = ["test_*.py"]
addopts = "--basetemp=.pytest_temp"

[tool.ruff]
line-length = 100
target-version = "py310"
