[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notespacellm"
version = "1.0.0"
description = "Local NotebookLM alternative for private document analysis, RAG-assisted research, and multi-format report generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
keywords = [
    "notebooklm-alternative",
    "rag",
    "local-first",
    "pyside6",
    "document-analysis",
    "document-chat",
    "privacy-first",
    "chromadb",
    "llm",
    "pwa",
    "python"
]
urls = { Homepage = "https://github.com/file-bricks/NoteSpaceLLM", Repository = "https://github.com/file-bricks/NoteSpaceLLM", Issues = "https://github.com/file-bricks/NoteSpaceLLM/issues" }

dependencies = [
    "PySide6>=6.5.0",
    "PyMuPDF>=1.24.10",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.3",
    "extract-msg>=0.48.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.4",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
]
export = [
    "weasyprint>=60.0",
]
api = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
dev = [
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = "."
python_files = ["test_*.py"]
